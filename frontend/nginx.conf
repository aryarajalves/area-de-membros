map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Permitir uploads de arquivos pesados (vídeos e mídias de aulas até 2 GB)
    client_max_body_size 2500M;
    client_body_timeout 1800s;
    client_header_timeout 600s;
    keepalive_timeout 600s;
    proxy_read_timeout 1800s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 1800s;

    location /api/ {
        proxy_pass http://area_aulas_backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Desativa o buffer em disco temporário do Nginx para uploads pesados (streaming direto)
        proxy_request_buffering off;
        proxy_buffering off;

        client_max_body_size 2500M;
        client_body_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        # Intercepta erros de gateway para rotas de API retornando JSON e nunca HTML
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        return 503 '{"detail":"O servidor está inicializando. Por favor, aguarde alguns instantes e tente novamente."}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
