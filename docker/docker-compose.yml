name: area-de-membros

services:
  db:
    image: postgres:16-alpine
    container_name: area_de_membros_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: projetobase
    ports:
      - "5435:5432"
    volumes:
      - area_de_membros_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: area_de_membros_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - ../backend/.env
    ports:
      - "8010:8000"
    networks:
      default:
        aliases:
          - area_aulas_backend
          - area_de_membros_backend
    volumes:
      - ../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: area_de_membros_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: area_de_membros_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "3010:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  area_de_membros_pg_data:
